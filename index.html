
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concours TikTok</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
  text-align: center;
}
header {
  background: #171717;
  padding: 25px;
  font-size: 25px;
  font-weight: bold;
}
main {
  padding: 30px 20px;
}
h1 { color: #ff3158; }
button {
  background: #ff3158;
  color: white;
  border: 0;
  padding: 15px 25px;
  border-radius: 10px;
  font-size: 18px;
}
.box {
  background: #202020;
  padding: 25px;
  border-radius: 15px;
  margin-top: 25px;
}
</style>
</head>
<body>
<header>🎁 CONCOURS TIKTOK</header>
<main>
<h1>Bienvenue au concours !</h1>
<p>Participez à notre concours et tentez votre chance !</p>
<div class="box">
<h2>🏆 Grand concours</h2>
<p>Découvrez notre jeu concours.</p>
<p>Bonne chance à tous !</p>
</div>
</main>
</body>
</html>
